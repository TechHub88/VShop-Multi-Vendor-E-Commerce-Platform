vshop_laravel:
  replicaCount: 2
  image:
    repository: "asia-south1-docker.pkg.dev/vridhee-464216/backend/vshop_laravel"
    tag: "latest"
    imagePullPolicy: "Always"
  type: ClusterIP
  resources:
    requests:
      minMemory: "300Mi"
      minCpu: "300m"
    limits:
      maxMemory: "1Gi"
      maxCpu: "1000m"

  env:
    APP_NAME: "VShop"
    APP_ENV: "production"
    APP_KEY: "base64:kGofaCM13N92VWv+fkCA4IgqnWjUAlE7qJ7M5gs4f6o="
    APP_DEBUG: "false"
    APP_TIMEZONE: "Asia/Kolkata"
    APP_URL: "https://vshop.vridhee.com"
    DB_CONNECTION: "mysql"
    DB_HOST: "srv1643.hstgr.io"
    DB_PORT: "3306"
    DB_DATABASE: "u605775003_shop"
    DB_USERNAME: "u605775003_shopAdmin"
    DB_PASSWORD: "WLUrYJv4lpfDgPayQpbdz7idsaNl48zM"
    SESSION_DRIVER: "cookie"
    SESSION_COOKIE: "vshop_session_v2"
    CACHE_STORE: "file"
    QUEUE_CONNECTION: "database"
    FILESYSTEM_DISK: "public"
    WEBSOCKET_URL: "https://api.vridhee.com/socket.io"
    WEBSOCKET_INTERNAL_URL: "http://vshop-websocket:3005"
    LOG_CHANNEL: "stderr"
    LOG_LEVEL: "error"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://vridhee.com, https://www.vridhee.com, https://admin.vridhee.com, https://sanako.in, https://www.sanako.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: vshop.vridhee.com
      paths:
        - path: /
          pathType: Prefix
          service:
            port: 80
  tlsSecretName: "vridhee-ssl"
