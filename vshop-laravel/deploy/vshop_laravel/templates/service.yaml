apiVersion: v1
kind: Service
metadata:
  name: {{ include "vshop_laravel.fullname" . }}
  labels:
    {{- include "vshop_laravel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vshop_laravel.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vshop_laravel.selectorLabels" . | nindent 4 }}
