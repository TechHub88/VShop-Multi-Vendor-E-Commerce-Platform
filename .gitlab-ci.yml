# =============================================================================
# VShop CI/CD Pipeline — Kaniko + Helm (Kubernetes Executor)
#
# Architecture:
#   build stage  → Kaniko (builds & pushes container images, no Docker daemon)
#   deploy stage → gcloud + kubectl + helm (connects to cluster, deploys via Helm)
#
# Components:
#   - vshop_websocket  (Node.js WebSocket server)
#   - vshop_laravel    (PHP Laravel application)
#
# Environments:
#   - main branch → PRODUCTION  (GKE cluster)
#   - dev  branch → DEVELOPMENT (VM Kubernetes cluster)
# =============================================================================

stages:
  - build
  - deploy

variables:
  REPO_NAME: "backend"
  IMAGE_REGISTRY: "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPO_NAME}"

# =============================================================================
# SHARED TEMPLATES
# =============================================================================

# ---- Kaniko Build Template ----
# Builds container image and pushes to Google Artifact Registry.
# No Docker daemon, no DinD, no privileged mode.
.build_template:
  stage: build
  tags:
    - kube
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # Determine environment, image tag, and latest tag
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export ENV="PRODUCTION"
        export LATEST_TAG="latest"
      else
        export ENV="DEVELOPMENT"
        export LATEST_TAG="${CI_COMMIT_BRANCH}-latest"
      fi
    - export IMAGE_TAG="${ENV}-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_URI="${IMAGE_REGISTRY}/${COMPONENT_NAME}:${IMAGE_TAG}"

    # Configure Kaniko to authenticate with Google Artifact Registry
    - mkdir -p /kaniko/.docker
    - echo "${GCP_SA_KEY}" > /kaniko/gcp-key.json
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "credHelpers": {
          "${GCP_REGION}-docker.pkg.dev": "gcr"
        }
      }
      EOF
    - export GOOGLE_APPLICATION_CREDENTIALS=/kaniko/gcp-key.json

# ---- Helm Deploy Template ----
# Authenticates to GKE or dev VM cluster, deploys via Helm.
.deploy_template:
  stage: deploy
  tags:
    - kube
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
  before_script:
    # Install kubectl, gke-gcloud-auth-plugin, and helm
    - apt-get update && apt-get install -y kubectl google-cloud-sdk-gke-gcloud-auth-plugin > /dev/null 2>&1
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash > /dev/null 2>&1

    # Determine environment, image tag, and values file
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export ENV="PRODUCTION"
        export VALUES_FILE="values-main.yaml"
      else
        export ENV="DEVELOPMENT"
        export VALUES_FILE="values-dev.yaml"
      fi
    - export IMAGE_TAG="${ENV}-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_URI="${IMAGE_REGISTRY}/${COMPONENT_NAME}:${IMAGE_TAG}"
    - export DEPLOYMENT_NAME=$(echo ${COMPONENT_NAME} | tr '_' '-')

    # GCP authentication
    - echo "${GCP_SA_KEY}" > ${CI_PROJECT_DIR}/gcp-key.json
    - gcloud auth activate-service-account --key-file=${CI_PROJECT_DIR}/gcp-key.json
    - gcloud config set project ${GCP_PROJECT_ID}

    # Connect to the appropriate cluster
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "Connecting to GKE (production)..."
        if [ -n "$GCP_CLUSTER_REGION" ]; then
          gcloud container clusters get-credentials ${GCP_CLUSTER_NAME} \
            --region ${GCP_CLUSTER_REGION} \
            --project ${GCP_PROJECT_ID}
        else
          gcloud container clusters get-credentials ${GCP_CLUSTER_NAME} \
            --zone ${GCP_CLUSTER_ZONE} \
            --project ${GCP_PROJECT_ID}
        fi
      else
        echo "Connecting to DEV VM Kubernetes cluster..."
        echo "${KUBE_CONFIG_DEV}" | base64 -d > ${CI_PROJECT_DIR}/kubeconfig
        export KUBECONFIG=${CI_PROJECT_DIR}/kubeconfig

        # Create/update image pull secret for dev cluster
        kubectl create secret docker-registry gcr-pull-secret \
          --docker-server=${GCP_REGION}-docker.pkg.dev \
          --docker-username=_json_key \
          --docker-password="${GCP_SA_KEY}" \
          -n default \
          --dry-run=client -o yaml | kubectl apply -f -

        # Patch default service account to auto-use the pull secret
        kubectl patch serviceaccount default -n default \
          -p '{"imagePullSecrets": [{"name": "gcr-pull-secret"}]}' || true
      fi

# =============================================================================
# WEBSOCKET SERVER
# =============================================================================

websocket_build:
  extends: .build_template
  variables:
    COMPONENT_NAME: "vshop_websocket"
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/vshop-websocket"
        --dockerfile "${CI_PROJECT_DIR}/vshop-websocket/Dockerfile"
        --destination "${IMAGE_URI}"
        --destination "${IMAGE_REGISTRY}/${COMPONENT_NAME}:${LATEST_TAG}"
        --cache=true
        --cache-repo="${IMAGE_REGISTRY}/kaniko-cache"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - vshop-websocket/**/*
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - vshop-websocket/**/*
      when: always

websocket_deploy:
  extends: .deploy_template
  variables:
    COMPONENT_NAME: "vshop_websocket"
  needs:
    - job: websocket_build
      artifacts: false
  script:
    - |
      helm upgrade --install ${DEPLOYMENT_NAME} \
        ./vshop-websocket/deploy/${COMPONENT_NAME} \
        -f ./vshop-websocket/deploy/${COMPONENT_NAME}/${VALUES_FILE} \
        --namespace default \
        --create-namespace \
        --set ${COMPONENT_NAME}.image.repository=${IMAGE_REGISTRY}/${COMPONENT_NAME} \
        --set ${COMPONENT_NAME}.image.tag=${IMAGE_TAG} \
        --set rolloutId=${CI_PIPELINE_ID}
    - echo "✅ ${DEPLOYMENT_NAME} deployed successfully (rolling update)."
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - vshop-websocket/**/*
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - vshop-websocket/**/*
      when: always

# =============================================================================
# LARAVEL APP
# =============================================================================

laravel_build:
  extends: .build_template
  variables:
    COMPONENT_NAME: "vshop_laravel"
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/vshop-laravel"
        --dockerfile "${CI_PROJECT_DIR}/vshop-laravel/Dockerfile"
        --destination "${IMAGE_URI}"
        --destination "${IMAGE_REGISTRY}/${COMPONENT_NAME}:${LATEST_TAG}"
        --cache=true
        --cache-repo="${IMAGE_REGISTRY}/kaniko-cache"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - vshop-laravel/**/*
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - vshop-laravel/**/*
      when: always

laravel_deploy:
  extends: .deploy_template
  variables:
    COMPONENT_NAME: "vshop_laravel"
  needs:
    - job: laravel_build
      artifacts: false
  script:
    - |
      helm upgrade --install ${DEPLOYMENT_NAME} \
        ./vshop-laravel/deploy/${COMPONENT_NAME} \
        -f ./vshop-laravel/deploy/${COMPONENT_NAME}/${VALUES_FILE} \
        --namespace default \
        --create-namespace \
        --set ${COMPONENT_NAME}.image.repository=${IMAGE_REGISTRY}/${COMPONENT_NAME} \
        --set ${COMPONENT_NAME}.image.tag=${IMAGE_TAG} \
        --set rolloutId=${CI_PIPELINE_ID}
    - echo "✅ ${DEPLOYMENT_NAME} deployed successfully (rolling update)."
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - vshop-laravel/**/*
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - vshop-laravel/**/*
      when: always
