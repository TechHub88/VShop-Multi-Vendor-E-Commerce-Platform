apiVersion: v1
kind: Service
metadata:
  name: {{ include "vshop_websocket.fullname" . }}
  labels:
    {{- include "vshop_websocket.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vshop_websocket.type }}
  ports:
    - port: {{ .Values.vshop_websocket.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vshop_websocket.selectorLabels" . | nindent 4 }}
