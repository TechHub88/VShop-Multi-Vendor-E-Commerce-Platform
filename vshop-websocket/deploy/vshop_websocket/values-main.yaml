vshop_websocket:
  replicaCount: 1
  image:
    repository: "asia-south1-docker.pkg.dev/vridhee-464216/backend/vshop_websocket"
    tag: "latest"
    imagePullPolicy: "Always"
  port: 3005
  host: "0.0.0.0"
  type: ClusterIP
  resources:
    requests:
      minMemory: "200Mi"
      minCpu: "200m"
    limits:
      maxMemory: "500Mi"
      maxCpu: "500m"

  nodeEnv: "PRODUCTION"
  corsOrigin: "*"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://vridhee.com, https://www.vridhee.com, https://admin.vridhee.com, https://sanako.in, https://www.sanako.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # Ensure WebSocket support is enabled in Ingress
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: api.vridhee.com
      paths:
        - path: /socket.io
          pathType: Prefix
          service:
            port: 3005
    - host: api.sanako.in
      paths:
        - path: /socket.io
          pathType: Prefix
          service:
            port: 3005
  tlsSecretName: "vridhee-ssl"
